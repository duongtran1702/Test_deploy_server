version: '3.8'

services:
  # -------------------------------------------------------------
  # NGINX REVERSE PROXY (Cổng vào duy nhất từ bên ngoài)
  # -------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: production-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - order-service
      - payment-service

  # -------------------------------------------------------------
  # DATABASE: MySQL 8.0 (Chỉ mạng nội bộ, KHÔNG mở ports ra ngoài)
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: production-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_123}
      MYSQL_DATABASE: ${DB_NAME:-order_db}
      MYSQL_USER: ${DB_USER:-order_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-order_pass_123}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # MESSAGE BROKER: Apache Kafka (KRaft Mode)
  # -------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: production-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "4L622nShTUiBenVznRAALA"
      KAFKA_KRAFT_CLUSTER_ID: "4L622nShTUiBenVznRAALA"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # -------------------------------------------------------------
  # MICROSERVICE 1: Order Service
  # -------------------------------------------------------------
  order-service:
    image: ${ORDER_IMAGE:-ghcr.io/duongtran1702/test_deploy_server/order-service:latest}
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: production-order-service
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_SERVICE_URL: http://payment-service:8082
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-order_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-order_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-order_pass_123}
    depends_on:
      - kafka
      - db

  # -------------------------------------------------------------
  # MICROSERVICE 2: Payment Service
  # -------------------------------------------------------------
  payment-service:
    image: ${PAYMENT_IMAGE:-ghcr.io/duongtran1702/test_deploy_server/payment-service:latest}
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: production-payment-service
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-order_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-order_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-order_pass_123}
    depends_on:
      - kafka
      - db

volumes:
  mysql-data:

networks:
  default:
    name: production-network
