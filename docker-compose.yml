version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. DATABASE: MySQL 8.0 (Đáp ứng yêu cầu đề bài có kết nối DB)
  # -------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: production-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_123}
      MYSQL_DATABASE: ${DB_NAME:-order_db}
      MYSQL_USER: ${DB_USER:-order_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-order_pass_123}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # 2. MESSAGE BROKER: Apache Kafka (KRaft Mode - No Zookeeper)
  # -------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: production-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: "4L622nShTUiBenVznRAALA"
      KAFKA_KRAFT_CLUSTER_ID: "4L622nShTUiBenVznRAALA"
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # -------------------------------------------------------------
  # 3. KAFKA UI: Giao diện trực quan xem message & topics
  # -------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: production-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-production-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # -------------------------------------------------------------
  # 4. MICROSERVICE 1: Order Service (Port 8081)
  # -------------------------------------------------------------
  order-service:
    image: ${ORDER_IMAGE:-ghcr.io/duongtran1702/test_deploy_server/order-service:latest}
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: production-order-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYMENT_SERVICE_URL: http://payment-service:8082
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-order_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-order_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-order_pass_123}
    depends_on:
      - kafka
      - db

  # -------------------------------------------------------------
  # 5. MICROSERVICE 2: Payment Service (Port 8082)
  # -------------------------------------------------------------
  payment-service:
    image: ${PAYMENT_IMAGE:-ghcr.io/duongtran1702/test_deploy_server/payment-service:latest}
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: production-payment-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME:-order_db}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-order_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-order_pass_123}
    depends_on:
      - kafka
      - db

volumes:
  mysql-data:

networks:
  default:
    name: production-network
