name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ci-build:
    name: Build & Test Jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      - run: chmod +x gradlew && ./gradlew bootJar -x test --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: '**/build/libs/*[!plain].jar'

  package-docker:
    name: Build & Push Images to GHCR
    needs: ci-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jars
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/${REPO_LC}/order-service:${{ github.sha }} -t ghcr.io/${REPO_LC}/order-service:latest -f order-service/Dockerfile .
          docker push ghcr.io/${REPO_LC}/order-service:${{ github.sha }}
          docker push ghcr.io/${REPO_LC}/order-service:latest
          docker build -t ghcr.io/${REPO_LC}/payment-service:${{ github.sha }} -t ghcr.io/${REPO_LC}/payment-service:latest -f payment-service/Dockerfile .
          docker push ghcr.io/${REPO_LC}/payment-service:${{ github.sha }}
          docker push ghcr.io/${REPO_LC}/payment-service:latest

  cd-deploy:
    name: Deploy to VPS via SSH
    needs: package-docker
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VPS_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.VPS_USER }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            mkdir -p ${{ vars.DEPLOY_PATH }}
            cd ${{ vars.DEPLOY_PATH }}
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all && git reset --hard origin/main
            fi
            REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            cat <<EOF > .env
            DB_ROOT_PASSWORD=root_secret_123
            DB_NAME=order_db
            DB_USER=order_user
            DB_PASSWORD=order_pass_123
            ORDER_IMAGE=ghcr.io/${REPO_LC}/order-service:${{ github.sha }}
            PAYMENT_IMAGE=ghcr.io/${REPO_LC}/payment-service:${{ github.sha }}
            EOF
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps

      - name: Smoke Test qua Nginx Port 80
        run: |
          curl -s -o /dev/null -w '%{http_code}' --retry 10 --retry-delay 6 "http://${{ secrets.SERVER_HOST || secrets.VPS_HOST }}/api/orders" | grep -E "200|404|405"
